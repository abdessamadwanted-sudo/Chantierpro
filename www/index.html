    /* v1.0.44 : écran de démarrage — logo SiteTeam, les têtes de l'équipe se colorent pendant le chargement */
    #boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#cfd8e6;font:600 14px system-ui,-apple-system,Roboto,sans-serif;transition:opacity .35s,transform .35s;
      background:radial-gradient(circle at 50% 42%,#1b3a63 0,#0F2540 46%,#0a1a2e 100%)}
    #boot.l{background:radial-gradient(circle at 50% 42%,#ffffff 0,#EEF3FA 50%,#E2EAF5 100%);color:#5A6A80} #boot.out{opacity:0;transform:scale(1.04);pointer-events:none}
    #boot .lg{position:relative;width:136px;height:136px} #boot .lg svg{width:100%;height:100%;overflow:visible}
    #boot .lg:before{content:'';position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(56,130,246,.45),transparent 65%);animation:bPulse 2.2s ease-in-out infinite}
    @keyframes bPulse{0%,100%{transform:scale(.92);opacity:.55}50%{transform:scale(1.06);opacity:1}}
    #boot .hd circle,#boot .hd path{fill:rgba(255,255,255,.22);transition:fill .55s ease,transform .55s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center}
    #boot .hd.on circle,#boot .hd.on path{transform:scale(1.08)} #boot .hd.on.a circle,#boot .hd.on.a path{fill:#f59e0b} #boot .hd.on.b circle,#boot .hd.on.b path{fill:#22c55e} #boot .hd.on.c circle,#boot .hd.on.c path{fill:#38bdf8}
    #boot .shine{animation:bShine 1.6s ease-in-out infinite} @keyframes bShine{0%{transform:translateX(-420px)}60%,100%{transform:translateX(420px)}}
    #boot .ok .cap{filter:drop-shadow(0 0 18px rgba(255,255,255,.65))}
    #boot b{display:flex;gap:.2em;font-size:21px;letter-spacing:.06em;color:#fff} #boot.l b{color:#0F2540}
    #boot b span{opacity:0;transform:translateY(6px);animation:bL .45s ease-out forwards} @keyframes bL{to{opacity:1;transform:none}}
    #boot .bar{display:none} #boot small{opacity:.7;font-weight:500;font-size:12.5px;letter-spacing:.02em}

  <script>
  // Sécurité des mises à jour rapides (OTA) : si une nouvelle version ne s'affiche pas en 25 s, l'application se ferme
  // et repart sur la version installée (APK) ; cette version n'est plus proposée en mise à jour rapide.
  (function () { try {
    var C = window.Capacitor, W = C && C.Plugins && C.Plugins.WebView; if (!W || !W.getServerBasePath) return;
    W.getServerBasePath().then(function (r) { var p = (r && r.path) || ''; if (p.indexOf('/ota/') < 0) return; var v = p.split('/ota/')[1].split('/')[0];
      setTimeout(function () { if (document.querySelector('.home2, .tm-login, .st-onb, .fullpage, .sheet-bg')) return;
        try { localStorage.setItem('ota.bad', v); localStorage.removeItem('ota.try'); } catch (e) {}
        var A = C.Plugins.App; if (A && A.exitApp) A.exitApp(); }, 25000); }).catch(function () {});
  } catch (e) {} })();
  </script>

  <script>
  (function () {
    var L = [].slice.call(document.querySelectorAll('script[data-src]')).map(function (e) { return e.getAttribute('data-src'); }), n = 0, bar = document.querySelector('#boot .bar i');
    var H = [].slice.call(document.querySelectorAll('#boot .hd'));
    function heads(p) { H.forEach(function (h, k) { if (p >= [0.12, 0.45, 0.8][k]) h.classList.add('on'); }); }
    setTimeout(function () { heads(0.12); }, 250);
    function go() { L.forEach(function (src) { var e = document.createElement('script'); e.src = src; e.async = false;
      e.onerror = function () { if (/pdf\.min/.test(src)) window.pdfjsLib = null; if (/pdf-lib/.test(src)) window.PDFLib = null; step(); }; e.onload = step; function step() { n++; if (bar) bar.style.width = Math.round(8 + 72 * n / L.length) + '%'; heads(0.15 + 0.7 * n / L.length); if (n === L.length) window.__tScripts = Date.now(); }
      document.body.appendChild(e); }); }
    requestAnimationFrame(function () { setTimeout(go, 0); });
    // l'écran de démarrage disparaît dès que l'application affiche quelque chose (accueil, connexion, accueil animé…)
    var done = false; function hide() { var b = document.getElementById('boot'); if (!b || done) return; done = true; if (bar) bar.style.width = '100%'; window.__tHome = Date.now(); heads(1); var lg = b.querySelector('.lg'); if (lg) lg.classList.add('ok'); setTimeout(function () { b.className += ' out'; setTimeout(function () { b.remove(); }, 380); }, 260); }
    new MutationObserver(function (m, o) { if (document.querySelector('.home2, .tm-login, .st-onb, .splash, .st-gate, .fullpage, .sheet-bg')) { hide(); o.disconnect(); } }).observe(document.body, { childList: true, subtree: true });
    setTimeout(hide, 30000);
  })();
