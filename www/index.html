  <script>
  // Sécurité des mises à jour rapides (OTA) : si une nouvelle version ne s'affiche pas en 25 s, l'application se ferme
  // et repart sur la version installée (APK) ; cette version n'est plus proposée en mise à jour rapide.
  (function () { try {
    var C = window.Capacitor, W = C && C.Plugins && C.Plugins.WebView; if (!W || !W.getServerBasePath) return;
    W.getServerBasePath().then(function (r) { var p = (r && r.path) || ''; if (p.indexOf('/ota/') < 0) return; var v = p.split('/ota/')[1].split('/')[0];
      setTimeout(function () { if (document.querySelector('.home2, .tm-login, .st-onb, .fullpage, .sheet-bg')) return;
        try { localStorage.setItem('ota.bad', v); localStorage.removeItem('ota.try'); } catch (e) {}
        var A = C.Plugins.App; if (A && A.exitApp) A.exitApp(); }, 25000); }).catch(function () {});
  } catch (e) {} })();
  </script>

  <script>
  (function () {
    var L = [].slice.call(document.querySelectorAll('script[data-src]')).map(function (e) { return e.getAttribute('data-src'); }), n = 0, bar = document.querySelector('#boot .bar i');
    function go() { L.forEach(function (src) { var e = document.createElement('script'); e.src = src; e.async = false;
      e.onerror = function () { if (/pdf\.min/.test(src)) window.pdfjsLib = null; if (/pdf-lib/.test(src)) window.PDFLib = null; step(); }; e.onload = step; function step() { n++; if (bar) bar.style.width = Math.round(8 + 72 * n / L.length) + '%'; if (n === L.length) window.__tScripts = Date.now(); }
      document.body.appendChild(e); }); }
    requestAnimationFrame(function () { setTimeout(go, 0); });
    // l'écran de démarrage disparaît dès que l'application affiche quelque chose (accueil, connexion, accueil animé…)
    var done = false; function hide() { var b = document.getElementById('boot'); if (!b || done) return; done = true; if (bar) bar.style.width = '100%'; window.__tHome = Date.now(); b.className += ' out'; setTimeout(function () { b.remove(); }, 300); }
    new MutationObserver(function (m, o) { if (document.querySelector('.home2, .tm-login, .st-onb, .splash, .st-gate, .fullpage, .sheet-bg')) { hide(); o.disconnect(); } }).observe(document.body, { childList: true, subtree: true });
    setTimeout(hide, 30000);
  })();
