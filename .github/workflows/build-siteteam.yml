name: Build SiteTeam

on:
  push:
    branches: [siteteam]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.env.example'
      - '.github/workflows/export-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy PDF reader (pdf.js)
        run: npm run copy-libs

      - name: Set app version (+ cache-busting of web files)
        run: |
          V=1.0.${{ github.run_number }}
          sed -i "s/__APP_VERSION__/$V/" www/js/app.js
          sed -i -E "s#(src|href)=\"(js|lib|vendor)/([^\"?]+)\"#\1=\"\2/\3?v=$V\"#g; s#href=\"styles.css\"#href=\"styles.css?v=$V\"#" www/index.html
          grep -n "v=$V" www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: App icon & splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f172a' --iconBackgroundColorDark '#0f172a' --splashBackgroundColor '#0f172a' --splashBackgroundColorDark '#0f172a'
        continue-on-error: true

      - name: Android versionCode / versionName (real update for Android)
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle

      - name: Camera permission
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml

      - name: Sync web code
        run: npx cap sync android

      # Avant ce correctif, la copie vers ~/.android n'était pas prise en compte par Gradle : chaque build
      # SiteTeam était signé par une clé debug aléatoire différente (mise à jour impossible sans désinstaller).
      # La clé est maintenant déclarée directement dans Gradle, puis l'empreinte est vérifiée.
      - name: Use fixed signing key (déclarée dans Gradle)
        run: bash ci/signing.sh

      - name: Build SiteTeam
        env:
          # mots de passe PUBLICS par défaut de toute clé « debug » Android (pas des secrets) ;
          # une future clé de publication Google Play devra passer par des secrets GitHub, jamais ici
          ST_KS_PASS: android
          ST_KEY_ALIAS: androiddebugkey
          ST_KEY_PASS: android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SiteTeam.apk

      - name: Verify signature (doit être la clé fixe E3:EC:F4:31…)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs SiteTeam.apk | tee certs.txt
          grep -qi "e3ecf43100a66eb4e55ef18aa18236a4374f56d0e3651ef30b62d9d058bee024" certs.txt || (echo "WRONG SIGNING KEY" && exit 1)
          grep -n -E "minSdkVersion|compileSdkVersion|targetSdkVersion" android/variables.gradle || true

      - uses: actions/upload-artifact@v4
        with:
          name: SiteTeam-apk
          path: SiteTeam.apk

      - name: Publish release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: siteteam-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SiteTeam v1.0.${{ github.run_number }}
          body: "Téléchargez **SiteTeam.apk** ci-dessous et installez-le sur Android."
          files: SiteTeam.apk
          make_latest: false
