name: SiteTeam test Android (compilation)
on:
  push:
    branches: [siteteam-ci]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: |
          mkdir -p out
          (npm install --no-audit --no-fund 2>&1 | tail -40) > out/npm.txt
          ls -la node_modules/siteteam-gdrive-auth >> out/npm.txt 2>&1 || true
          (CI=true npx cap add android 2>&1 | tail -60) > out/cap-add.txt; echo "exit ${PIPESTATUS[0]}" >> out/cap-add.txt
          (npx cap sync android 2>&1 | tail -40) > out/cap-sync.txt || true
          cat android/capacitor.settings.gradle > out/settings.txt 2>&1 || true
          (cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q 2>&1 | grep -v "^w:" | tail -80) > out/gradle.txt; ls -la android/app/build/outputs/apk/debug/ >> out/gradle.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name bot && git config user.email bot@example.com
          git checkout --orphan res && git rm -rfq --cached . && git add -f out && git commit -qm "android [skip ci]" && git push -f origin HEAD:siteteam-ci-android
