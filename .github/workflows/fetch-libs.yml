name: Fetch libs
on:
  push:
    branches: [libs-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm view @mlightcad/libredwg-web versions time --json > dwgver.json; cat dwgver.json | tail -30
          git config user.name bot && git config user.email bot@example.com
          git add dwgver.json && git commit -m "ver" && git push
