name: Fetch libs
on:
  push:
    branches: [libs-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p l8 fonts && cd l8 && npm pack @fontsource/caveat >/dev/null && tar xzf fontsource-caveat-*.tgz && ls package/files | head -50 > ../fonts/list.txt && cp package/files/caveat-latin-500-normal.woff2 package/files/caveat-latin-600-normal.woff2 ../fonts/ && cp package/LICENSE ../fonts/CAVEAT-LICENSE.txt 2>/dev/null; cd .. && rm -rf l8
          git config user.name bot && git config user.email bot@example.com
          git add fonts && git commit -m "fonts" && git push
