name: Fetch libs
on:
  push:
    branches: [libs-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p l5 && cd l5
          npm pack firebase@10.14.1 >/dev/null && tar xzf firebase-10.14.1.tgz
          ls package | grep compat | head -40
          mkdir -p ../vendorfb && cp package/firebase-app-compat.js package/firebase-auth-compat.js package/firebase-firestore-compat.js ../vendorfb/
          cd .. && rm -rf l5 && ls -la vendorfb
          git config user.name bot && git config user.email bot@example.com
          git add vendorfb && git commit -m "firebase" && git push
