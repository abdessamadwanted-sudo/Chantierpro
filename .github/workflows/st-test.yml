name: SiteTeam test (emulators)
on:
  push:
    branches: [siteteam-ci]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm i -g firebase-tools@13 && npm i --no-save playwright@1.47.2 @firebase/rules-unit-testing@3 firebase@10.14.1 && npx playwright install --with-deps chromium
      - run: node ci/rules.mjs && cat ci/firestore.rules | head -5 && head -3 ci/storage.rules
      - run: |
          mkdir -p ci-out/vendor && cp node_modules/firebase/firebase-storage-compat.js ci-out/vendor/ && node -e "console.log(require('firebase/package.json').version)" > ci-out/vendor/version.txt
          [ -f www/vendor/firebase/firebase-storage-compat.js ] || cp node_modules/firebase/firebase-storage-compat.js www/vendor/firebase/
      - run: |
          cd ci && (firebase emulators:start --only auth,firestore,storage --project siteteam > ../emu.log 2>&1 &) && cd ..
          for i in $(seq 1 60); do curl -s 127.0.0.1:8080 >/dev/null && curl -s 127.0.0.1:9099 >/dev/null && curl -s 127.0.0.1:9199 >/dev/null && break; sleep 2; done
          (cd www && python3 -m http.server 8765 > /dev/null 2>&1 &)
          sleep 2
          node ci/rules-test.mjs || true
          node ci/db-test.mjs || true
          node ci/st.mjs || true
          tail -30 emu.log > ci-out/emu.txt || true
      - run: |
          git config user.name bot && git config user.email bot@example.com
          git add -f ci-out && git commit -m "results [skip ci]" && git push
