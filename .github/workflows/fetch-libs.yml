name: Fetch libs
on:
  push:
    branches: [libs-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -x
          mkdir -p l9 pdflib && cd l9 && npm pack pdf-lib@1.17.1 && tar xzf *.tgz && cp package/dist/pdf-lib.min.js package/LICENSE.md ../pdflib/ ; cd .. && rm -rf l9 && ls -la pdflib
          git config user.name bot && git config user.email bot@example.com
          git add pdflib && git commit -m "pdflib" && git push
