name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy PDF reader (pdf.js)
        run: npm run copy-libs

      - name: Set app version (+ cache-busting of web files)
        run: |
          V=1.0.${{ github.run_number }}
          sed -i "s/__APP_VERSION__/$V/" www/js/app.js
          # empreinte de la partie native : si elle ne change pas, la mise à jour se fait sans réinstaller (paquet web)
          NID=$(cat package.json capacitor.config.json keystore/debug.keystore .github/workflows/build-apk.yml assets/* 2>/dev/null | sha1sum | cut -c1-16)
          sed -i "s/__NATIVE_ID__/$NID/" www/js/modules.js
          echo "{\"version\":\"$V\",\"native\":\"$NID\"}" > ota.json; cat ota.json
          sed -i -E "s#(src|href)=\"(js|lib|vendor)/([^\"?]+)\"#\1=\"\2/\3?v=$V\"#g; s#href=\"styles.css\"#href=\"styles.css?v=$V\"#" www/index.html
          grep -n "v=$V" www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Keep the chosen theme (no Android auto dark mode)
        run: |
          for f in android/app/src/main/res/values*/styles.xml; do sed -i 's#<style name="AppTheme\([^"]*\)" parent="\([^"]*\)">#&\n        <item name="android:forceDarkAllowed">false</item>#' "$f"; done
          grep -n "forceDark" android/app/src/main/res/values*/styles.xml || true

      - name: App icon & splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1b1e24' --iconBackgroundColorDark '#1b1e24' --splashBackgroundColor '#1b1e24' --splashBackgroundColorDark '#1b1e24'
        continue-on-error: true

      - name: Android versionCode / versionName (real update for Android)
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle

      - name: Share target (Partager → Chantier)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          act = '''
          <activity android:name="de.mindlib.sendIntent.SendIntentActivity" android:label="@string/app_name" android:exported="true" android:theme="@style/AppTheme.NoActionBar">
              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="image/*" />
              </intent-filter>
              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="image/*" />
              </intent-filter>
          </activity>
          '''
          if 'SendIntentActivity' not in s:
              s = s.replace('</application>', act + '</application>', 1)
          open(p, 'w').write(s)
          PY
          grep -n "SendIntent" android/app/src/main/AndroidManifest.xml

      - name: Camera permission
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml

      - name: Sync web code
        run: npx cap sync android

      - name: Use fixed signing key (updates keep your data)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Chantier.apk

      - name: Sign with the fixed key (same signature for every version → updates install over the old one)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner sign --ks keystore/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android Chantier.apk
          $BT/apksigner verify --print-certs Chantier.apk | tee certs.txt
          grep -qi "e3ecf43100a66eb4e55ef18aa18236a4374f56d0e3651ef30b62d9d058bee024" certs.txt || (echo "WRONG SIGNING KEY" && exit 1)

      - name: Web bundle for fast updates (no reinstall)
        run: |
          cd www && zip -q -r -9 ../www.zip . && cd .. && ls -la www.zip
          python3 -c "import zipfile,json; z=zipfile.ZipFile('www.zip'); m=json.load(open('ota.json')); m['files']=sum(1 for i in z.infolist() if not i.is_dir()); m['size']=sum(i.file_size for i in z.infolist()); json.dump(m,open('ota.json','w')); print(m)"

      - uses: actions/upload-artifact@v4
        with:
          name: Chantier-apk
          path: Chantier.apk

      - name: Publish release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chantier v1.0.${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          files: |
            Chantier.apk
            www.zip
            ota.json
          make_latest: true
