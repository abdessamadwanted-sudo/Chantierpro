name: ModelCore3D — Prototype Tests
on:
  pull_request:
    branches: [siteteam]
    paths:
      - 'www/js/modelcore3d.js'
      - 'www/js/modelcore-pdfstack.js'
      - 'ci/st.mjs'
      - 'www/js/modelcore-ifc-worker.js'
      - 'ci/modelcore-ifc.test.mjs'
      - 'ci/fixtures/modelcore-column.ifc'
      - 'package.json'
      - 'www/js/modelcore3d-templates.js'
      - 'www/js/m3d.js'
      - 'ci/modelcore3d.test.mjs'
      - '.github/workflows/modelcore3d-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-and-js:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check www/js/modelcore3d-templates.js
      - run: node --check www/js/modelcore3d.js
      - run: node --check www/js/modelcore-pdfstack.js
      - run: node --check www/js/m3d.js
      - run: node --check ci/modelcore3d.test.mjs
      - run: node ci/modelcore3d.test.mjs
      - run: node --check www/js/modelcore-ifc-worker.js
      - name: Installer le moteur IFC versionné
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Contrôler les fichiers embarqués
        run: npm run copy-libs && test -s www/vendor/ifc/web-ifc.wasm && test -s www/vendor/ifc/web-ifc-api-iife.js && test -s www/vendor/ifc/LICENSE.md
      - name: Test IFC réel
        run: node ci/modelcore-ifc.test.mjs
