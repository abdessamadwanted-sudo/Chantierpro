name: SiteTeam Preview APK (isolated)
on:
  push:
    branches:
      - feature/siteteam-backend-foundation
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/siteteam-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Check SiteTeam JavaScript syntax
        run: node --check www/js/siteteam-workspace.js
      - name: Copy PDF libraries
        run: npm run copy-libs
      - name: Set visible SiteTeam preview version
        run: sed -i 's/__APP_VERSION__/ST-002-preview/g' www/js/app.js
      - name: Set separate SiteTeam Preview Android identity
        run: sed -i 's/ma.chantier.app/ma.chantier.siteteam.preview/' capacitor.config.json
      - name: Build Android project
        run: |
          npx cap add android
          npx cap sync android
          sed -i -E 's/versionCode [0-9]+/versionCode 200002/; s/versionName "[^"]*"/versionName "2.0.2-preview"/' android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload preview APK only (no release)
        uses: actions/upload-artifact@v4
        with:
          name: siteteam-preview-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
