name: Fetch libs
on:
  push:
    branches: [libs-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -x
          mkdir -p l8 && cd l8 && npm pack @mlightcad/libredwg-web@0.8.0 && tar xzf *.tgz && rm -rf ../dwg2 && mkdir -p ../dwg2 && cp -r package/dist package/wasm package/lib ../dwg2/ && cd .. && rm -rf l8 && ls -R dwg2 | head -50
          git config user.name bot && git config user.email bot@example.com
          git add dwg2 && git commit -m "dwg files" && git push
