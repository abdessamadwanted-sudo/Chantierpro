name: Fetch libs
on:
  push:
    branches: [libs-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p l8 dwg && cd l8 && npm view @mlightcad/libredwg-web versions --json | tail -5 > ../dwg/versions.txt; npm pack @mlightcad/libredwg-web >/dev/null && tar xzf mlightcad-libredwg-web-*.tgz && (cd package && find . -type f | xargs ls -la > ../../dwg/files.txt; cat package.json > ../../dwg/package.json; cat README.md > ../../dwg/README.md 2>/dev/null; ls dist wasm 2>/dev/null >> ../../dwg/files.txt); cd .. && rm -rf l8
          git config user.name bot && git config user.email bot@example.com
          git add dwg && git commit -m "dwg info" && git push
