name: Fetch libs
on:
  push:
    branches: [libs-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p l4 && cd l4
          npm pack dxf-parser@1.1.2 >/dev/null && tar xzf dxf-parser-1.1.2.tgz
          ls -R package/dist | head -20
          mkdir -p ../vendordxf && cp package/dist/dxf-parser.js ../vendordxf/ 2>/dev/null || cp package/dist/*.js ../vendordxf/
          cd .. && rm -rf l4 && ls -la vendordxf
          git config user.name bot && git config user.email bot@example.com
          git add vendordxf && git commit -m "dxf" && git push
