name: Fetch libs
on:
  push:
    branches: [libs-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p l8 && cd l8 && npm pack send-intent@6.0.3 >/dev/null && tar xzf send-intent-6.0.3.tgz && cat package/android/src/main/java/de/mindlib/sendIntent/*.java package/android/src/main/res/values/*.xml package/android/src/main/res/layout/*.xml package/android/src/main/AndroidManifest.xml > ../si-java.txt; cd .. && rm -rf l8
          git config user.name bot && git config user.email bot@example.com
          git add si-java.txt && git commit -m "si java" && git push
