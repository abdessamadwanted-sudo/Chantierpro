name: Fetch libs
on:
  push:
    branches: [libs-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p l11 capsrc && cd l11 && npm pack @capacitor/android@6 && tar xzf *.tgz && find package -name "Bridge.java" -o -name "WebView.java" -o -name "WebViewLocalServer.java" | xargs -I{} cp {} ../capsrc/ ; cd .. && rm -rf l11; ls capsrc
          git config user.name bot && git config user.email bot@example.com
          git add capsrc && git commit -m "capsrc" && git push
