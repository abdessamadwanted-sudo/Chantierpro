<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SiteTeam Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    /* Panneau d'administration SiteTeam : réservé au Super Admin. Mise en page : barre d'onglets + listes et tuiles. */
    :root { --bg: #f4f6fb; --card: #ffffff; --fg: #0f172a; --muted: #5b6474; --line: #dde3ee; --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --chip: #eef2ff; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b1220; --card: #131c2e; --fg: #e5e9f2; --muted: #93a0b8; --line: #243149; --accent: #60a5fa; --ok: #22c55e; --warn: #f59e0b; --bad: #f87171; --chip: #1c2740; color-scheme: dark; } }
    :root[data-theme="dark"] { --bg: #0b1220; --card: #131c2e; --fg: #e5e9f2; --muted: #93a0b8; --line: #243149; --accent: #60a5fa; --ok: #22c55e; --warn: #f59e0b; --bad: #f87171; --chip: #1c2740; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
    .hd { display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
    .hd b { font-size: 16px; white-space: nowrap; } .hd small { color: var(--muted); overflow-wrap: anywhere; } .grow { flex: 1; min-width: 0; }
    .hd .btn { padding: 7px 10px; font-size: 13px; } a.btn { text-decoration: none; display: inline-block; }
    nav { display: flex; gap: 4px; overflow-x: auto; padding: 0 max(12px, env(safe-area-inset-left, 0px)) 8px; scrollbar-width: none; }
    nav button { flex: none; border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer; }
    nav button.on { background: var(--chip); color: var(--accent); }
    main { max-width: 1100px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
    h2 { margin: 6px 0 0; font-size: 18px; text-wrap: balance; } h3 { margin: 0 0 8px; font-size: 15px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
    .tile b { font-size: 24px; font-variant-numeric: tabular-nums; } .tile small { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
    .row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; min-width: 0; }
    .row:first-child { border-top: 0; } .row .t { display: grid; min-width: 0; } .row .t b { overflow-wrap: anywhere; } .row .t small { color: var(--muted); overflow-wrap: anywhere; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--chip); color: var(--muted); white-space: nowrap; }
    .pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.acc { color: var(--accent); }
    .btn { border: 0; background: var(--accent); color: #fff; padding: 9px 14px; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
    .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); } .btn.bad { background: var(--bad); }
    .btn:focus-visible, nav button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select, textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
    textarea { min-height: 80px; } label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
    .ck { display: flex; gap: 8px; align-items: center; color: var(--fg); font-size: 14px; } .ck input { width: auto; }
    .cks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 12px; }
    .muted { color: var(--muted); } .empty { color: var(--muted); padding: 16px 0; text-align: center; }
    .bar { display: grid; grid-template-columns: 1fr auto; gap: 8px; } .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; } .kv span { color: var(--muted); }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; background: var(--bg); padding: 8px; border-radius: 8px; margin: 0; }
    dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--fg); padding: 16px; width: min(560px, calc(100vw - 32px)); max-height: 85vh; overflow: auto; }
    dialog::backdrop { background: rgba(2, 6, 23, .55); }
    #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 20; }
    .login { max-width: 360px; margin: 12vh auto 0; padding: 0 16px; display: grid; gap: 12px; }
    .bars { display: grid; gap: 6px; } .bars div { display: grid; grid-template-columns: 110px 1fr 40px; gap: 8px; align-items: center; font-size: 13px; }
    .bars i { display: block; height: 8px; border-radius: 4px; background: var(--accent); } .bars em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
      /* v1.0.53 : Centre de contrôle */
    nav.cc-tabs { padding: 0; }
    .cc-r { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
    .cc-r:first-of-type { border-top: 0; } .cc-r .t { display: grid; gap: 3px; min-width: 200px; } .cc-r .t small { color: var(--muted); overflow-wrap: anywhere; }
    .cc-d { display: flex; flex-wrap: wrap; gap: 6px; } .cc-d .btn { padding: 6px 10px; font-size: 12.5px; }
    .cc-o { margin: 16px 0 2px; } .cc-o small { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
  <div id="app"><div class="login"><b>SiteTeam Admin</b><p class="muted">Chargement…</p></div></div>
  <div id="toast" hidden></div>
  <script src="vendor/firebase/firebase-app-compat.js"></script>
  <script src="vendor/firebase/firebase-auth-compat.js"></script>
  <script src="vendor/firebase/firebase-firestore-compat.js"></script>
  <script src="js/team.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
