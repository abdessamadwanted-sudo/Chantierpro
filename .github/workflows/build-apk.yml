name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy PDF reader (pdf.js)
        run: npm run copy-libs

      - name: Create Android project
        run: npx cap add android

      - name: App icon & splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1b1e24' --iconBackgroundColorDark '#1b1e24' --splashBackgroundColor '#1b1e24' --splashBackgroundColorDark '#1b1e24'
        continue-on-error: true

      - name: Camera permission
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml

      - name: Sync web code
        run: npx cap sync android

      - name: Use fixed signing key (updates keep your data)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Chantier.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Chantier-apk
          path: Chantier.apk

      - name: Publish release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chantier v1.0.${{ github.run_number }}
          body: "Téléchargez **Chantier.apk** ci-dessous et installez-le sur Android."
          files: Chantier.apk
          make_latest: true
