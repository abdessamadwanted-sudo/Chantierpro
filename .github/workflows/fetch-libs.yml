name: Fetch libs
on:
  push:
    branches: [libs-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          (npm view @capgo/capacitor-native-biometric versions --json | tail -15; npm view @capgo/capacitor-native-biometric@6 peerDependencies --json; npm view @capgo/capacitor-native-biometric@6 version) > bio.txt 2>&1; cat bio.txt
          git config user.name bot && git config user.email bot@example.com
          git add bio.txt && git commit -m "bio" && git push
