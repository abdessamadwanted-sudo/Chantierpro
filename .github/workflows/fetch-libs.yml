name: Fetch libs
on:
  push:
    branches: [libs-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm view send-intent versions --json | tail -15 > si-versions.txt
          V=$(npm view "send-intent@^6" version | tail -1 | awk '{print $NF}' | tr -d "'") ; echo "V=$V" >> si-versions.txt
          npm view send-intent@$V peerDependencies >> si-versions.txt || true
          mkdir -p l6 && cd l6 && npm pack send-intent@$V >/dev/null && tar xzf send-intent-*.tgz && rm -rf ../vendorsi && cp -r package ../vendorsi && cd .. && rm -rf l6
          git config user.name bot && git config user.email bot@example.com
          git add vendorsi si-versions.txt && git commit -m "send-intent" && git push
