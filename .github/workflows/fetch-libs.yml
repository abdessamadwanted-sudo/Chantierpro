name: Fetch libs
on:
  push:
    branches: [libs-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p l10 fflate && cd l10 && npm pack fflate@0.8.2 && tar xzf *.tgz && ls package package/umd 2>/dev/null; cp package/umd/index.js ../fflate/fflate.min.js; cp package/LICENSE ../fflate/ ; cd .. && rm -rf l10; ls -la fflate
          git config user.name bot && git config user.email bot@example.com
          git add fflate && git commit -m "fflate" && git push
